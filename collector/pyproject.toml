[project]
name = "vibecheck-collector"
version = "0.1.0"
description = "Collects development metrics for the Matrix ecosystem vibe check"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
vibecheck-collect = "vibecheck.cli:main"
vibecheck-discover = "vibecheck.discover:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
