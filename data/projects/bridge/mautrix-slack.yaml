slug: mautrix-slack
name: mautrix-slack
category: bridge
kind: puppeting bridge
homepage: https://docs.mau.fi/bridges/go/slack/index.html
summary: Puppeting bridge between Matrix and Slack on mautrix-go bridgev2.
repos:
- url: https://github.com/mautrix/slack
  forge: github
  role: main
sources:
  matrix_org_listing: https://matrix.org/ecosystem/bridges/slack/
  other: []
maturity: stable
platforms:
- server
licence: AGPL-3.0-or-later
fork_of: null
distribution:
- docker
funding:
- https://github.com/sponsors/tulir
features:
  network: Slack
  framework:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/slack/blob/1b55de52bf978729d5aea681b6412eb6f269a3ca/go.mod
    note: mautrix-go bridgev2
  puppeting:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/double-puppeting.md
    note: 'double puppeting (automatic via an appservice registration, or manual login); relay mode: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/relay-mode.md'
  e2ee:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/end-to-bridge-encryption.md
    note: optional end-to-bridge encryption of the Matrix side (Matrix rooms encrypted between users and
      the bridge)
  backfill:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/slack/blob/1b55de52bf978729d5aea681b6412eb6f269a3ca/pkg/connector/backfill.go
  media:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/slack/blob/1b55de52bf978729d5aea681b6412eb6f269a3ca/ROADMAP.md
  reactions_edits:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/slack/blob/1b55de52bf978729d5aea681b6412eb6f269a3ca/ROADMAP.md
  group_chats:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/slack/blob/1b55de52bf978729d5aea681b6412eb6f269a3ca/ROADMAP.md
    note: channels, group DMs
  login_methods:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/go/slack/authentication.md
    note: user token + d cookie, or a Slack app (bot) token
  network_tos_risk:
    value: not-found
    note: no ToS warning found in the docs
ai:
  policy:
    value: restricted
    quote: In general, you can use AI to help with contributions. However, AI slop is not accepted. The
      author is accountable for the code. [...] AI should not be used for communicating with humans.
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/contributing.md#L23-L37
  dev_usage:
    value: occasional
    evidence:
    - 2 of 104 non-bot commits in the last 365 days (1.9 %) carry an AI co-author trailer or 'Generated
      with' line, e.g. https://github.com/mautrix/slack/commit/65e45a4d669f6b13a5a3302532ff4f77b80fc708,
      https://github.com/mautrix/slack/commit/a04c357e38700102b23e1068ad0e7212654249bd
  in_product:
    value: none-found
    note: no generative-AI features found in the README, ROADMAP or code
    source: null
notes: 'matrix.org lists Beeper and Tulir as maintainers. Other Slack bridges: matrix-appservice-slack
  (matrix.org, archived), mx-puppet-slack and matrix-puppet-slack (inactive).'
