slug: mautrix-telegram
name: mautrix-telegram
category: bridge
kind: puppeting bridge
homepage: https://docs.mau.fi/bridges/go/telegram/index.html
summary: Puppeting and relay-bot bridge between Matrix and Telegram, rewritten in Go on mautrix-go bridgev2.
repos:
- url: https://github.com/mautrix/telegram
  forge: github
  role: main
sources:
  matrix_org_listing: https://matrix.org/ecosystem/bridges/telegram/
  other: []
maturity: stable
platforms:
- server
licence: AGPL-3.0-or-later
fork_of: null
distribution:
- docker
funding:
- https://github.com/sponsors/tulir
features:
  network: Telegram
  framework:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/telegram/blob/f7bb767679114f0e1c0e901cbf1562e56f53ac60/go.mod
    note: mautrix-go bridgev2
  puppeting:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/double-puppeting.md
    note: 'double puppeting (automatic via an appservice registration, or manual login); relay mode: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/relay-mode.md'
  e2ee:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/end-to-bridge-encryption.md
    note: optional end-to-bridge encryption of the Matrix side (Matrix rooms encrypted between users and
      the bridge)
  backfill:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/telegram/blob/f7bb767679114f0e1c0e901cbf1562e56f53ac60/pkg/connector/backfill.go
  media:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/telegram/blob/f7bb767679114f0e1c0e901cbf1562e56f53ac60/ROADMAP.md
    note: files and media; polls, games and buttons not bridged
  reactions_edits:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/telegram/blob/f7bb767679114f0e1c0e901cbf1562e56f53ac60/ROADMAP.md
  group_chats:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/telegram/blob/f7bb767679114f0e1c0e901cbf1562e56f53ac60/ROADMAP.md
    note: groups, supergroups and channels
  login_methods:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/go/telegram/authentication.md
    note: phone number + code (and 2FA password), QR code, or a bot token for relaying
  network_tos_risk:
    value: partial
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/go/telegram/authentication.md#L6-L10
    note: '"Telegram is known to ban suspicious users, and a brand new account using a 3rd party client
      is considered suspicious. Using a well-established account is perfectly safe."'
ai:
  policy:
    value: restricted
    quote: In general, you can use AI to help with contributions. However, AI slop is not accepted. The
      author is accountable for the code. [...] AI should not be used for communicating with humans.
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/contributing.md#L23-L37
  dev_usage:
    value: occasional
    evidence:
    - 1 of 403 non-bot commits in the last 365 days (0.2 %) carry an AI co-author trailer or 'Generated
      with' line, e.g. https://github.com/mautrix/telegram/commit/b00e116ce527ec53b3053702bc141241a2de56ea
    note: attributed share is below the rubric's 1 % line; shown as occasional because commits are attributed
      (lower bound)
  in_product:
    value: none-found
    note: no generative-AI features found in the README, ROADMAP or code
    source: null
notes: 'matrix.org still lists it as Python/Beta; the repo''s CHANGELOG.md says the bridge was rewritten
  in Go on bridgev2, and v26.10 dropped migration from the Python version. Other Telegram bridges: matrix-appservice-telegram
  (FruitieX, abandoned).'
checked: 2026-11-05
