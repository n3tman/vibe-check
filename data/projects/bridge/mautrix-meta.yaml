slug: mautrix-meta
name: mautrix-meta
category: bridge
kind: puppeting bridge
homepage: https://docs.mau.fi/bridges/go/meta/index.html
summary: Puppeting bridge between Matrix and Facebook Messenger or Instagram DMs, replacing the older
  mautrix-facebook and mautrix-instagram.
repos:
- url: https://github.com/mautrix/meta
  forge: github
  role: main
sources:
  matrix_org_listing: https://matrix.org/ecosystem/bridges/facebook_messenger/
  other: []
maturity: stable
platforms:
- server
licence: AGPL-3.0-or-later
fork_of: null
distribution:
- docker
funding:
- https://github.com/sponsors/tulir
features:
  network: Facebook Messenger, Instagram
  framework:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/meta/blob/69a505d69039a24796ad5d24a599a548d315c300/go.mod
    note: mautrix-go bridgev2
  puppeting:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/double-puppeting.md
    note: 'double puppeting (automatic via an appservice registration, or manual login); relay mode: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/relay-mode.md'
  e2ee:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/general/end-to-bridge-encryption.md
    note: optional end-to-bridge encryption of the Matrix side (Matrix rooms encrypted between users and
      the bridge)
  backfill:
    value: 'yes'
    how: code
    source: https://github.com/mautrix/meta/blob/69a505d69039a24796ad5d24a599a548d315c300/pkg/messagix/securehistory/history.go
  media:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/meta/blob/69a505d69039a24796ad5d24a599a548d315c300/ROADMAP.md
  reactions_edits:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/meta/blob/69a505d69039a24796ad5d24a599a548d315c300/ROADMAP.md
  group_chats:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/meta/blob/69a505d69039a24796ad5d24a599a548d315c300/ROADMAP.md
  login_methods:
    value: 'yes'
    how: claimed
    source: https://github.com/mautrix/docs/blob/da79465b14f6490d6f9a73d53ca5953d6cce0d75/bridges/go/meta/authentication.md
    note: browser cookies (Facebook, Messenger, Instagram) or username/password (messenger-lite, Instagram
      android mode)
  network_tos_risk:
    value: not-found
    note: no ToS warning found in the docs
ai:
  policy:
