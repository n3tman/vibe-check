ai:
  policy:
    value: restricted
    quote: >-
      Contributions are judged on their content, not on how they were produced. AI-assisted contributions
      are accepted; unreviewed AI output is not. [...] If your PR was made with the help of AI, you
      must convey that this is the case using the PR template.
    source: https://github.com/element-hq/element-meta/blob/ea731f1fc96190b2214538c76d95ee34e00400cd/CONTRIBUTING.md
  dev_usage:
    value: regular
    evidence:
    - CLAUDE.md and AGENTS.md in both repos; .claude/skills in element-x-ios.
    - >-
      element-x-android: 284 of about 2,830 non-bot commits in the last 365 days (about 10 %) carry
      an AI co-author trailer, mostly Claude.
    - 'element-x-ios: 19 of about 1,420 (about 1.3 %), Claude and copilot-swe-agent.'
    - >-
      The Android PR template asks AI-assisted PRs to request a Copilot review; the iOS template
      asks for the model and harness used.
  in_product:
    value: none-found
    note: null
    source: null
notes: >-
  matrix.org maturity: Stable. Element's organisation-wide AI policy (element-meta CONTRIBUTING.md,
  merged 2026-11-02 in https://github.com/element-hq/element-meta/pull/3393) applies to all element-hq
  repositories and to matrix-org repositories where Element is the core contributor. Both repos'
  CONTRIBUTING.md also say "We are also fine with AI led contributions within reasonable bounds".
  Android FOSS builds need Android 7.0 (API 24), enterprise builds API 33.
