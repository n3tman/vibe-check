ai:
  policy:
    value: banned
    quote: Sable declines any contribution believed to include or derive from AI-generated content, including
      ChatGPT, Claude, Copilot, Llama and similar tools.
    source: https://git.sable.moe/SableClient/Sable-next/src/commit/4bfde17ab615f8cb69048e7f8dbbf65e629ed0da/CONTRIBUTING.md#L34
  dev_usage:
    value: none-found
    evidence:
    - 'v2 (Sable-next): no agent files, no AI-attributed commits in the last 365 days (first-parent history,
      3,981 commits) at 4bfde17ab615'
    - 'v1 (Sable-Legacy): CLAUDE.md, AGENTS.md, .cursorrules and .github/copilot-instructions.md hold
      the same short deterrent text telling AI agents not to open issues or PRs; they are not working
      agent configs'
    - 'v1: 3 commits in its whole merged history carry Copilot co-author trailers; none in its own first-parent
      history of the last year'
  in_product:
    value: none-found
    note: null
    source: null
notes: 'Sable Legacy (v1) PR template asked for an AI disclosure (none / partially / fully AI generated),
  so v1 was "restricted"; v2 bans AI-generated content outright. The fork adds over Cinny: quality-of-life
  features, cosmetics, a Tauri/Electron desktop app; v2 replaces the matrix-js-sdk core with a Rust one.
  Metrics: count the v2 repo; v1 history includes all of Cinny.'
checked: '2026-11-05'
