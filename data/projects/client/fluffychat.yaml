ai:
  policy:
    value: restricted
    quote: >-
      We do not vibe code! You are required to understand and be able to explain every single line
      of code of your contribution.
    source: https://github.com/krille-chan/fluffychat/blob/3881abc8eb4ed0ceebdae468e7d74bba2091fffc/CONTRIBUTING.md
  dev_usage:
    value: occasional
    evidence:
    - >-
      2 of about 1,390 non-bot commits in the last 365 days carry a Claude co-author trailer (both
      2026-10-22), below the 1 % line.
    - >-
      AGENTS.md, which told agents "it is strictly prohibited to let an LLM edit any files in this
      repository", was removed on 2026-10-22 (commit 607edd5a765d32228af9dee012b1b2e4718cc729).
  in_product:
    value: none-found
    note: null
    source: null
notes: >-
  AI policy history: CONTRIBUTING said "Usage of LLMs to generate code, documentation, commit messages
  or PR description is strictly prohibited" from 2026-06-01 (commit 264f4533a44e3f5f7cc3d5bc6265154dfd782019)
  until 2026-10-22, when it became "Do not vibe code!". Contributions are limited to collaborators
  "for now due to spam". Issue https://github.com/krille-chan/fluffychat/issues/3753 asked to also
  reject LLM code reviews. dev_usage is set to occasional on attributed commits although the share
  is under 1 %.
