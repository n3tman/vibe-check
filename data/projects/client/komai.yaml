ai:
  policy:
    value: encouraged
    quote: >-
      Anyone can use AI and send Pull Requests for new features and bugfixes. However, large changes
      require engineering judgment [...] If you're not comfortable reviewing and defending the code
      your AI produces, please submit an Issue instead.
    source: https://github.com/etkecc/komai/blob/5de517eb7cdfca10704dec1d1faa6945917eebf2/docs/user-guide/ai.md
  dev_usage:
    value: regular
    evidence:
    - >-
      README: "Komai is built with AI"; docs/user-guide/ai.md: "Komai is a largely AI-vibe-engineered
      Matrix chat application" (Claude Code and Codex).
    - >-
      About 1,575 of 3,564 non-bot commits in the last 365 days (about 44 %) carry an AI co-author
      trailer, mostly Claude.
    - >-
      CLAUDE.md and AGENTS.md at the repo root; Claude-assisted translation tooling in bin/translations/.
  in_product:
    value: optional
    note: >-
      Optional voice transcription (speech-to-text) through any OpenAI-compatible API, cloud or self-hosted;
      a local MCP server lets AI hosts such as Claude Code read and act on a running profile.
    source: https://github.com/etkecc/komai/blob/5de517eb7cdfca10704dec1d1faa6945917eebf2/docs/user-guide/features/voice-transcription.md
notes: >-
  matrix.org maturity: Beta. PLAN.md lists Komai among bots and tools (lane 5); it is a chat client,
  so lane 2 writes it. Lane 5 should not add a second komai file.
checked: '2026-11-05'
