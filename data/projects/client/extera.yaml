      2 of about 1,070 non-bot commits in the last 365 days carry an Assisted-by trailer (opencode
      with GLM and DeepSeek models).
    - >-
      UI strings other than English and Russian are machine-translated with an LLM (scripts/translate.js,
      OpenAI API).
  in_product:
    value: optional
