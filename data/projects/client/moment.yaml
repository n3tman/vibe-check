notes: Fork of Mirage (README; Mirage's HEAD 9a4ababd is an ancestor of main). Adds reaction display,
  proper edit display, upstream matrix-nio, emoji shortcodes, spoilers and external media previews off
  by default (docs/MIRAGEDIFF.md, docs/CHANGELOG.md). README says "currently in alpha". Licence, maturity
  and features corrected in the integration pass from lane 9's reading at 2667256d. Last tag v0.7.6 (2025-03-06).
  Releases are Linux only (docs/INSTALL.md).
