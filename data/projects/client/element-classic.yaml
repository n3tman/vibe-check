    value: none-found
    note: null
    source: null
notes: >-
  Element's organisation-wide AI policy (element-meta CONTRIBUTING.md, merged 2026-11-02 in https://github.com/element-hq/element-meta/pull/3393)
  applies to all element-hq repositories and to matrix-org repositories where Element is the core
  contributor. Both READMEs: "This client is still supported and receives security updates but no
  new features or usability enhancements are made. It is recommended to use Element X". matrix.org
  maturity: Stable.
