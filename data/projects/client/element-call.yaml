ai:
  policy:
    value: restricted
    quote: >-
      Contributions are judged on their content, not on how they were produced. AI-assisted contributions
      are accepted; unreviewed AI output is not. [...] If your PR was made with the help of AI, you
      must convey that this is the case using the PR template.
    source: https://github.com/element-hq/element-meta/blob/ea731f1fc96190b2214538c76d95ee34e00400cd/CONTRIBUTING.md
  dev_usage:
    value: occasional
    evidence:
    - >-
      46 of about 1,280 non-bot commits in the last 365 days (about 3.6 %) carry a Claude co-author
      trailer.
    - AGENTS.md at the repo root.
    - >-
      AI review workflow .github/workflows/claude.yaml (anthropics/claude-code-action, run when a
      PR gets the Claude-Review label).
  in_product:
    value: none-found
    note: >-
      Background blur uses on-device MediaPipe selfie segmentation (machine learning, not generative
      AI).
    source: https://github.com/element-hq/element-call/blob/1e17a6411cb625b369b9d88fc300ce46329ae46d/src/mediapipe/imageSegmenter/README.md
notes: >-
  Not on the matrix.org clients list (it is a calling app). Its own CONTRIBUTING.md: "Take responsibility
  for AI-generated code." Element's organisation-wide AI policy (element-meta PR 3393) applies.
