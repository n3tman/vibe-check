notes: >-
  Not on the matrix.org clients list; found through the LinuxLinks roundup, which still lists it.
  The default branch's last commit is 2021-01-13 and the GitLab project's last activity
  2022-08-28 (API, checked 2026-11-05); the forge does not mark it archived. Flathub marks
  org.eu.encom.spectral end-of-life ("This application is no longer maintained.",
  https://flathub.org/api/v2/eol/message) and lists org.vranki.spectral as its rebase target
  (https://flathub.org/api/v2/eol/rebase); the last Flathub release is 648 (2019-05-22).
  The former homepage spectral.im, linked from the GitLab description and the README's docs links,
  now serves an unrelated site, so homepage is null. NeoChat's README says "NeoChat is a fork of
  Spectral" (https://invent.kde.org/network/neochat/-/blob/2bcdbc0f7ba8eb25ba4a21c06f2a4da7d498533b/README.md).
  Licence: LICENSE is GPL-3.0 and the one source header present says "version 3 of the License, or
  (at your option) any later version"; the AppStream file says GPL-3.0. Fedora packaging per
  the README; not re-checked. Searched GitLab issues for AI, LLM, ChatGPT, Copilot, "generated":
  nothing about AI.
