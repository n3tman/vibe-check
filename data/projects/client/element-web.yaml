      / GPL-3.0 / commercial with a CLA for contributions. Many forks exist (SchildiChat).
ai:
  policy:
    value: restricted
    quote: >-
      The PR description must be written by a human and mustn't be generated by AI tools. [...] Any
      PR with a generated AI PR description will be closed. (PR template: "- [ ] I used AI tools
      to help create this PR.")
    source: https://github.com/element-hq/element-web/blob/a3f5be54f4bf77eee950e38aedb3251bf059dc38/CONTRIBUTING.md
  dev_usage:
    value: occasional
    evidence:
    - AGENTS.md at the repo root (instructions for AI coding agents).
    - >-
      25 of about 2,100 non-bot commits in the last 365 days (about 1.2 %) carry an AI co-author
      trailer (Claude, Copilot Autofix).
    - The PR template has an "AI assistance" checkbox.
  in_product:
    value: none-found
    note: null
    source: null
notes: >-
  matrix.org maturity: Stable. Element Desktop moved into the element-web monorepo (apps/desktop);
