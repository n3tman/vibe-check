notes: >-
  The project's own docs say it is "not ready for general use yet": there are no releases
  (https://gitlab.computer.surgery/matrix/grapevine/-/issues/18), little user-facing
  documentation (issue 21), and undocumented breaking changes to the config format
  (https://gitlab.computer.surgery/matrix/grapevine/-/blob/f82328dcf20e4f4a03e7fce11cb66bb8660e1c80/book/introduction.md#L24). Maturity "alpha" is our reading of that. MSC2285 (private read
  receipts) is marked "TODO: Implement" in the code and is not listed. Non-goals include
  first-party Docker images and macOS / Windows support (book/introduction.md#L65).
  gitlab.computer.surgery reset every connection from the research session, so the code was read
  from a zip a person saved by hand, not from a clone.
