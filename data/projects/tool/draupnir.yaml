slug: draupnir
name: Draupnir
category: tool
kind: moderation
homepage: https://the-draupnir-project.github.io/draupnir-documentation/
summary: A moderation and community-management bot that applies shared policy lists across rooms, with
  protections and prompts instead of typed commands; a continuation of Mjolnir.
repos:
- url: https://github.com/the-draupnir-project/Draupnir
  forge: github
  role: main
sources:
  matrix_org_listing: https://matrix.org/ecosystem/integrations/
  other: []
maturity: stable
platforms: [server]
licence: AFL-3.0
fork_of: mjolnir
distribution: [docker]
funding: ['https://opencollective.com/draupnir', 'https://nlnet.nl/project/Draupnir/']
features:
  purpose: {value: 'moderation (policy lists, bans, protections)', how: claimed, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/README.md'}
  framework: {value: matrix-bot-sdk and matrix-protection-suite, how: code, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/apps/draupnir/package.json',
    note: Element's fork @vector-im/matrix-bot-sdk}
  e2ee: {value: 'yes', how: code, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/apps/draupnir/package.json',
    note: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/matrix-org/matrix-sdk-crypto-nodejs
      dependency'}
  hosting: {value: self-host, how: claimed, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/README.md',
    note: bot or appservice mode; Docker image gnuxie/draupnir}
  config: {value: config file and !draupnir commands / prompts, how: claimed, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/README.md'}
  ai_backend: {value: none-found, how: code, source: 'https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/apps/draupnir/package.json'}
ai:
  policy: {value: none-found, quote: null, source: null}
  dev_usage:
    value: none-found
    evidence:
    - 0 of 74 non-bot commits in the last 365 days carry an AI attribution (0.0%), counted at d57af49a6a97
  in_product: {value: none-found, note: null, source: null}
  funder_policy:
  - funder: NLnet Foundation (NGI Zero Core fund)
    grant: https://nlnet.nl/project/Draupnir/
    grant_start: 2024-04
    grant_source: https://github.com/the-draupnir-project/Draupnir/blob/d57af49a6a971f1d112106cfe1d5be5cd3aa1c76/README.md
    policy: https://nlnet.nl/foundation/policies/generativeAI/1.1/
    policy_version: 1.1 (from 2026-01-26) under the transitional arrangement; 2.0 (from 2026-10-20, read-only
      use only) otherwise
    value: restricted
    quote: In any case, outcomes purely generated by AI are not allowed to be submitted as work eligible
      for payment (as part) of the grant. … For any substantive use of GenAI that materially affects outputs,
      public disclosure is required, making it available to both users and contributors.
    scope: work delivered within the NLnet-funded grant, not the project as a whole or outside contributors
    transition: 'NLnet FAQ: "There are two general exceptions: for projects within NGI Zero programmes, because
      these were already in flight during the publication of the version 2.0 of the policy." The grant is an
      NGI Zero Core grant running since 2024-04, so 1.1 can still apply; the FAQ names NGI Zero Commons Fund,
      NGI Taler and Fediversity as examples and does not name NGI Zero Core. Under 2.0 the value would be
      banned ("It is not allowed to use generative AI for producing artefacts of any kind"). https://nlnet.nl/foundation/policies/generativeAI/faq/'
    transparency: The policy asks grantees to summarise their stance on GenAI in the README and website;
      no such statement found in the README at the checked commit.
    checked: 2026-11-05
notes: 'Licence: the code is AFL-3.0 per matrix.org, with other files under the licences in LICENSES/
  (REUSE layout; the README is CC-BY-SA-4.0). Policy on AI: an open issue by the lead maintainer (https://github.com/the-draupnir-project/Draupnir/issues/990,
  "Formalise LLM Policy: Liberation for Synthetics", 2025-10-29) discusses LLMs, but no contribution rule
  had been adopted in CONTRIBUTING.md at the checked commit, so the policy reads none-found. Funding:
  NLnet NGI Zero Core grant (from 2024-04) per the README and https://nlnet.nl/project/Draupnir/; NLnet''s
  own GenAI policy for funded work is recorded under ai.funder_policy, separately from the project''s
  own policy. No AI-attributed commits were found in the last 365 days.'
checked: 2026-11-05
