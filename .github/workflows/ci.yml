name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project collector --group dev pytest collector/tests -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Validate data/ against the schema
        run: npm run validate
        working-directory: site
      - name: Validate fixtures/
        run: npm run validate
        working-directory: site
        env:
          VIBE_DATA: fixtures
      - name: Build with fixtures
        run: npm run build
        working-directory: site
        env:
          VIBE_DATA: fixtures
      - name: Build with data
        run: npm run build
        working-directory: site
