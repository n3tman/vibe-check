name: Refresh metrics

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these slugs (space-separated), empty for all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Reuse last week's clones
        uses: actions/cache@v4
        with:
          path: cache/repos
          key: repos-${{ github.run_id }}
          restore-keys: repos-
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          for s in $ONLY; do args+=(--only "$s"); done
          uv run --project collector vibecheck-collect "${args[@]}"
      - name: Commit changed metrics
        id: commit
        run: |
          git add data/metrics
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Metrics refreshed by the weekly collector run on $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
